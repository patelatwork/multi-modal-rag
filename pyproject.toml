[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag"
version = "1.0.0"
description = "Retrieval-augmented question answering over PDFs, including their figures and tables."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-groq>=0.2",
    "langchain-chroma>=0.2",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "tenacity>=9.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Layout detection and OCR for scanned PDFs. Also needs poppler and tesseract
# installed as system packages.
ocr = ["unstructured[all-docs]>=0.15", "pdfplumber>=0.11"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
multimodal-rag = "multimodal_rag.cli:main"

[tool.setuptools.packages.find]
include = ["multimodal_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
    "ignore::UserWarning:huggingface_hub.*",
]

[tool.coverage.run]
source = ["multimodal_rag"]
omit = ["*/api/app.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends()/File() defaults are the documented idiom
    "RUF012",  # mutable class attrs are fine on non-pydantic classes here
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals and use assert freely.
"tests/*" = ["S101", "SLF001", "ANN"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
